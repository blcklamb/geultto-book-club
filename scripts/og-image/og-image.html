<!doctype html>
<!--
  OG 이미지(public/og-image.png, 1200x630) 원본.
  다시 만들 때:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --window-size=1200,630 --hide-scrollbars --virtual-time-budget=8000 \
    --screenshot=public/og-image.png scripts/og-image/og-image.html
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>글또 5기 북클럽 OG 이미지</title>
<style>
  :root { --bg: #faf8f5; --fg: #1e1a16; --muted: #6f675e; --border: #e6e1d9; --primary: #904529; --paper: #fdfbf9; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: var(--fg); word-break: keep-all; display: grid; grid-template-columns: 1fr 520px; align-items: center;
  }
  .copy { padding-left: 96px; display: grid; gap: 24px; }
  .copy svg { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 64px; font-weight: 600; line-height: 1.3; }
  p { margin: 16px 0 0; font-size: 28px; line-height: 1.6; color: var(--muted); }
  #stage { width: 520px; height: 630px; }
</style>
</head>
<body>
  <section class="copy">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><clipPath id="rp"><path d="M34 18.5Q46 13.5 58 16V48Q46 45.5 34 50Z"/></clipPath></defs>
      <g fill="#904529" stroke="#904529" stroke-width="2" stroke-linejoin="round">
        <path d="M6 16Q18 13.5 30 18.5V50Q18 45.5 6 48Z"/><path d="M34 18.5Q46 13.5 58 16V48Q46 45.5 34 50Z"/>
      </g>
      <path d="M12 26.5H24M12 32.5H24M12 38.5H19.5" stroke="#fdfbf9" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M43.5 8H50.5V32L47 28.5L43.5 32Z" fill="#fdfbf9" clip-path="url(#rp)"/>
    </svg>
    <div>
      <h1>글또 5기 북클럽</h1>
      <p>모임 일정을 확인하고 독후감, 토론 발제,<br />인상 깊은 구절을 함께 나누는 독서모임</p>
    </div>
  </section>
  <div id="stage"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(520, 630);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 520 / 630, 1, 1000);
camera.position.set(-38, 30, 150);
camera.lookAt(0, -2, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xe9e2d6, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-40, 80, 90);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60 });
scene.add(key);

const toShapes = (d) => new SVGLoader()
  .parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`)
  .paths.flatMap((p) => SVGLoader.createShapes(p));
function roundedBar(x1, x2, y, h) {
  const s = new THREE.Shape(), r = h / 2;
  s.moveTo(x1, y - r); s.lineTo(x2, y - r);
  s.absarc(x2, y, r, -Math.PI / 2, Math.PI / 2, false);
  s.lineTo(x1, y + r);
  s.absarc(x1, y, r, Math.PI / 2, Math.PI * 1.5, false);
  return s;
}
function bookmark() {
  const s = new THREE.Shape();
  s.moveTo(43.5, 15.9); s.lineTo(50.5, 15.3); s.lineTo(50.5, 32);
  s.lineTo(47, 28.5); s.lineTo(43.5, 32); s.closePath();
  return s;
}
const pageMat = new THREE.MeshStandardMaterial({ color: 0x904529, roughness: 0.55, metalness: 0.05 });
const paperMat = new THREE.MeshStandardMaterial({ color: 0xfdfbf9, roughness: 0.7 });
const extrude = (shapes, depth) => new THREE.ExtrudeGeometry(shapes, {
  depth, bevelEnabled: true, bevelThickness: 0.4, bevelSize: 0.4, bevelSegments: 3, curveSegments: 24,
});
function page(d, details, angle) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(extrude(toShapes(d), 3), pageMat);
  body.castShadow = true;
  g.add(body);
  for (const shape of details) {
    const m = new THREE.Mesh(extrude([shape], 0.6), paperMat);
    m.position.z = 3.2;
    m.castShadow = true;
    g.add(m);
  }
  g.scale.set(1, -1, 1);
  g.position.set(-32, 32, 0);
  const hinge = new THREE.Group();
  hinge.add(g);
  hinge.rotation.y = angle;
  return hinge;
}
const book = new THREE.Group();
book.add(page("M6 16Q18 13.5 30 18.5V50Q18 45.5 6 48Z",
  [roundedBar(12, 24, 26.5, 2.8), roundedBar(12, 24, 32.5, 2.8), roundedBar(12, 19.5, 38.5, 2.8)], 0.3));
book.add(page("M34 18.5Q46 13.5 58 16V48Q46 45.5 34 50Z", [bookmark()], -0.3));
book.rotation.set(-0.18, 0.28, 0);
book.scale.setScalar(0.95);
scene.add(book);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.08 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -23;
ground.receiveShadow = true;
scene.add(ground);

renderer.render(scene, camera);
</script>
</body>
</html>
